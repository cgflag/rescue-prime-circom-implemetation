name: CI

on:
  push:
  pull_request:

jobs:
  reference-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run reference tests
        run: npm test
